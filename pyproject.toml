[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onchain-detective"
version = "1.0.0"
description = "AI-powered blockchain detective framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "openai>=1.12",
    "tenacity>=8.2",
    "diskcache>=5.6",
    "python-telegram-bot>=20.7",
    "aiohttp>=3.9",
    "jupyter>=1.0",
    "ipykernel>=6.28",
]

[tool.setuptools.packages.find]
where = ["."]